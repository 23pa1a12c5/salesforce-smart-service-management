<template>
    <lightning-card title="Smart Service Management" icon-name="standard:case">

        <div class="slds-p-around_medium">

            <lightning-input
                label="Customer Name"
                value={customerName}
                onchange={handleCustomerName}>
            </lightning-input>

            <lightning-input
                type="email"
                label="Email"
                value={email}
                onchange={handleEmail}>
            </lightning-input>

            <lightning-input
                type="tel"
                label="Phone"
                value={phone}
                onchange={handlePhone}>
            </lightning-input>

            <lightning-combobox
                label="Category"
                value={category}
                options={categoryOptions}
                onchange={handleCategory}>
            </lightning-combobox>

            <lightning-input
                label="Subject"
                value={subject}
                onchange={handleSubject}>
            </lightning-input>

            <lightning-textarea
                label="Description"
                value={description}
                onchange={handleDescription}>
            </lightning-textarea>

            <lightning-combobox
                label="Priority"
                value={priority}
                options={priorityOptions}
                onchange={handlePriority}>
            </lightning-combobox>

            <div class="slds-m-top_medium">
                <lightning-button
                    variant="brand"
                    label="Submit Complaint"
                    onclick={submitComplaint}>
                </lightning-button>
            </div>

        </div>

    </lightning-card>
</template>
